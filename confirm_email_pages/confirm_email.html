<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang="pageTitle">Study With | Email Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/confirm_email_pages/confirm_email.css">
</head>
<body>
  <main class="confirmation-page">
    <div class="illustration">
      <img src="/images/2989096.jpg" alt="Envelope illustration">
    </div>
    <div class="confirmation-form">
      <h2 data-lang="digit">Please enter the 6-digit code from the email.</h2>
      <form id="verificationForm">
        <div class="code-inputs">
          <input class="inputs" type="text" maxlength="1">
          <input class="inputs" type="text" maxlength="1">
          <input class="inputs" type="text" maxlength="1">
          <input class="inputs" type="text" maxlength="1">
          <input class="inputs" type="text" maxlength="1">
          <input class="inputs" type="text" maxlength="1">
        </div>
        <button class="confirm-button" data-lang="conf">Confirm</button>
      </form>
      <p id="errorMessage" style="color: red; display: none;" data-lang="incorrect">The verification code is incorrect. Please try again.</p>
      <a class="resend-link" data-lang="resend">Resend email in <span id="timer">60</span> seconds</a>
    </div>
  </main>
  <script src="/footer/footer.js"></script>
  <script src="/header/header-noauth.js"></script>
  <script src="/confirm_email_pages/confirm-email.js"></script>

  <script>
    const translations = {
      en: {
        pageTitle: 'Study With | Email Confirmation',
        digit: 'Please enter the 6-digit code from the email.',
        conf: 'Confirm',
        incorrect: 'The verification code is incorrect. Please try again.',
        resend: 'Resend email in <span id="timer">60</span> seconds'
      },
      ua: {
        pageTitle: 'Study With | Підтвердження пошти',
        digit: 'Будь ласка, введіть 6-значний код з листа.',
        conf: 'Продовжити',
        incorrect: 'Код підтвердження невірний. Будь ласка, спробуйте ще раз.',
        resend: 'Надіслати лист знову через <span id="timer">60</span> секунд'
      }
    };

    function applyLanguage(lang) {
      const langData = translations[lang] || translations.en;

      document.title = langData.pageTitle;

      document.querySelectorAll('[data-lang]').forEach(element => {
        const langKey = element.getAttribute('data-lang');
        if (langData[langKey]) {
          if (element.tagName === 'BUTTON' || element.tagName === 'DIV' || element.tagName === 'SPAN') {
            element.textContent = langData[langKey];
          } else {
            element.innerHTML = langData[langKey];
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const userLang = localStorage.getItem('language');
      applyLanguage(userLang);

      let countdown = 60; 
      const timerElement = document.getElementById('timer');

      const countdownInterval = setInterval(() => {
        if (countdown > 0) {
          countdown--;
          timerElement.textContent = countdown;
        } else {
          clearInterval(countdownInterval);
        }
      }, 1000); 
    });
  </script>
</body>
</html>
