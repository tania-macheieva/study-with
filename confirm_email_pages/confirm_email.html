<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="confirm_email.css">
</head>
<body>
  <main class="confirmation-page">
    <div class="illustration">
      <img src="images/2989096.jpg" alt="Envelope illustration">
    </div>
    <div class="confirmation-form">
      <h2>Please enter the 6-digit code from the email.</h2>
      <form id="verificationForm">
      <div class="code-inputs">
        <input class="inputs" type="text" maxlength="1">
        <input class="inputs" type="text" maxlength="1">
        <input class="inputs" type="text" maxlength="1">
        <input class="inputs" type="text" maxlength="1">
        <input class="inputs" type="text" maxlength="1">
        <input class="inputs"  type="text" maxlength="1">
      </div>
      <button class="confirm-button">Confirm</button>
    </form>
      <a class="resend-link">Resend email in <span id="timer">60</span> seconds</a>
    </div>
  </main>
  <script src="footer.js"></script>
<script src="header.js"></script>
<script src="confirm-email.js"></script>
</body>
</html>
