<!DOCTYPE html>
<html lang="en" data-lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="profileTitle">Study With - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link rel="stylesheet" href="../profile-page/style.css">
</head>

<body>
    <script src="../header/auth-header.js"></script>
    <script src="student-lang.js"></script>

    <div class="page-container">
        <div class="content">
            <main class="profile-container">
                <div class="user-info">
                    <label for="upload-image">
                        <img id="profile-image" class="profile-image" src="images/profile-picture.png" alt="user image">
                    </label>
                    <input type="file" id="upload-image" accept="image/*" style="display: none;">
                    <div class="action-buttons">
                        <button id="confirm-image" style="display: none;" title="Confirm">
                            <i class="fas fa-check"></i>
                        </button>
                        <button id="remove-image" style="display: none;" title="Remove">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <p data-lang="username">username</p>
                    <button class="btn-teacher" id="become-teacher-btn" data-lang="btnTeacher">Become a teacher</button>
                </div>

                <div class="container-my">
                    <div class="my-courses">
                        <h2 data-lang="myCourses">My courses</h2>
                        <div class="courses-list">
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 1</p>
                                <div class="progress-bar">
                                    <span style="width: 70%;"></span>
                                </div>
                                <p class="percent">70%</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 2</p>
                                <div class="progress-bar">
                                    <span style="width: 40%;"></span>
                                </div>
                                <p class="percent">40%</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 3</p>
                                <div class="progress-bar">
                                    <span style="width: 50%;"></span>
                                </div>
                                <p class="percent">50%</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                        </div>
                        <button class="btn-view-all-1" data-lang="btnViewAll">View all</button>
                    </div>
                    <div>
                        <div class="my-certificates">
                            <h2 data-lang="myCertificates">My certificates</h2>
                            <div class="certificates-list">
                                <div class="certificate">
                                    <p class="p-1" data-lang="certificateName">Certificate name 1</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download" data-lang="downloadCertificate">
                                        <img src="images/download-certificate.png" alt="">
                                    </button>
                                </div>
                                <div class="certificate">
                                    <p class="p-1" data-lang="certificateName">Certificate name 2</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download" data-lang="downloadCertificate">
                                        <img src="images/download-certificate.png" alt="">
                                    </button>
                                </div>
                                <div class="certificate">
                                    <p class="p-1" data-lang="certificateName">Certificate name 3</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download" data-lang="downloadCertificate">
                                        <img src="images/download-certificate.png" alt="">
                                    </button>
                                </div>
                            </div>
                            <button class="btn-view-all-3" data-lang="btnViewAll">View all</button>
                        </div>
                    </div>
                    <div class="my-bookmarks">
                        <h2 data-lang="myBookmarks">My bookmarks</h2>
                        <div class="bookmarks-list">
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 1</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 2</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 3</p>
                                <img src="images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                        </div>
                        <button class="btn-view-all-4" data-lang="btnViewAll">View all</button>
                    </div>
            </main>
        </div>

        <script src="../footer/footer.js"></script>
        <script>
       document.addEventListener('DOMContentLoaded', () => {
    const becomeTeacherButton = document.getElementById('become-teacher-btn');

    if (becomeTeacherButton) {
        becomeTeacherButton.addEventListener('click', async () => {
            const authData = getAuthData();

            if (!authData.token || !authData.email) {
                alert("Please log in before becoming a teacher.");
                window.location.href = "/login.html";
                return;
            }

            // Додавання підтвердження перед дією
            const userConfirmed = confirm(
                "Are you sure you want to become a teacher? If you click 'OK', your role will be updated to 'teacher'."
            );

            if (!userConfirmed) {
                return; // Користувач натиснув 'Скасувати'
            }

            try {
                // Відправляємо запит для оновлення ролі
                const response = await fetch("http://localhost:8000/auth/student-to-teacher", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authData.token}`,
                    },
                    body: JSON.stringify({ email: authData.email, role: "teacher" }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert("You are now a teacher! Please provide the necessary details to create a teacher profile and verify your qualifications.");
                    sessionStorage.setItem("currentStep", "0");
                    window.location.href = "/registration_pages/full_reg_teacher.html";
                } else {
                    alert(data.error || "Failed to update role.");
                }
            } catch (error) {
                console.error("Error updating role:", error);
                alert("An error occurred. Please try again later.");
            }
        });
    }
});

// Функція для отримання даних автентифікації (така сама, як у JS-файлі для логіну)
function getAuthData() {
    return {
        token: localStorage.getItem('token'),
        userId: localStorage.getItem('userId'),
        role: localStorage.getItem('role'),
        name: localStorage.getItem('name'),
        email: localStorage.getItem('email'),
    };
}

        </script>

    </div>
</body>

</html>
