        <script>
    const uploadInput = document.getElementById('upload-image');
    const profileImage = document.getElementById('profile-image');
    const removeImageButton = document.getElementById('remove-image');
    const confirmImageButton = document.getElementById('confirm-image');


    uploadInput.addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {

            if (file.size > 1 * 1024 * 1024) {
                alert('The file size exceeds 1 MB. Please upload a smaller file.');
                uploadInput.value = '';
                return;
            }


            const reader = new FileReader();
            reader.onload = function (e) {
                profileImage.src = e.target.result;
                removeImageButton.style.display = 'inline-block';
                confirmImageButton.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    });


    profileImage.addEventListener('click', function () {
        removeImageButton.style.display = 'inline-block';
        confirmImageButton.style.display = 'inline-block';
    });


    removeImageButton.addEventListener('click', function () {
        profileImage.src = 'images/profile-picture.png';
        uploadInput.value = '';
        removeImageButton.style.display = 'none';
        confirmImageButton.style.display = 'none';
    });


//бек для завантаження фото профіля в базу
    confirmImageButton.addEventListener('click', async function () {
    const file = uploadInput.files[0];
    if (!file) {
        alert('Please select an image to upload.');
        return;
    }

    const email = localStorage.getItem('email'); // Отримання ID користувача
    if (!email) {
        alert('User email is not available. Please log in again.');
        return;
    }

    const formData = new FormData();
    formData.append('profileImage', file);
    formData.append('email', email);
    try {
        const response = await fetch('http://localhost:8000/auth/upload-profile-image', {
            method: 'POST',
            body: formData,
        });

        const result = await response.json();
        if (response.ok) {
            alert('Profile image updated successfully!');
            profileImage.src = `http://localhost:8000${result.filePath}`; // Додаємо абсолютний шлях
        } else {
            alert(`Error: ${result.error}`);
        }
    } catch (error) {
        console.error('Error uploading profile image:', error);
        alert('An error occurred while uploading the profile image.');
    }
    // Ховаємо кнопки після завантаження
    removeImageButton.style.display = 'none';
    confirmImageButton.style.display = 'none';
});


       document.addEventListener('DOMContentLoaded', () => {
    const becomeTeacherButton = document.getElementById('become-teacher-btn');

    if (becomeTeacherButton) {
        becomeTeacherButton.addEventListener('click', async () => {
            const authData = getAuthData();

            if (!authData.token || !authData.email) {
                alert("Please log in before becoming a teacher.");
                window.location.href = "/login.html";
                return;
            }

            // Додавання підтвердження перед дією
            const userConfirmed = confirm(
                "Are you sure you want to become a teacher? If you click 'OK', your role will be updated to 'teacher'."
            );

            if (!userConfirmed) {
                return; // Користувач натиснув 'Скасувати'
            }

            try {
                // Відправляємо запит для оновлення ролі
                const response = await fetch("http://localhost:8000/auth/student-to-teacher", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${authData.token}`,
                    },
                    body: JSON.stringify({ email: authData.email, role: "teacher" }),
                });

                const data = await response.json();

                if (response.ok) {
                    alert("You are now a teacher! Please provide the necessary details to create a teacher profile and verify your qualifications.");
                    sessionStorage.setItem("currentStep", "0");
                    window.location.href = "/registration_pages/full_reg_teacher.html";
                } else {
                    alert(data.error || "Failed to update role.");
                }
            } catch (error) {
                console.error("Error updating role:", error);
                alert("An error occurred. Please try again later.");
            }
        });
    }
});

// Функція для отримання даних автентифікації (така сама, як у JS-файлі для логіну)
function getAuthData() {
    return {
        token: localStorage.getItem('token'),
        userId: localStorage.getItem('userId'),
        role: localStorage.getItem('role'),
        name: localStorage.getItem('name'),
        email: localStorage.getItem('email'),
    };
}

document.body.addEventListener('click', async (event) => {
    if (event.target.tagName === 'BUTTON' && event.target.textContent === 'Save changes') {
        const name = document.querySelector('input[placeholder="Enter your real name"]').value;
        const nickname = document.querySelector('input[placeholder="Enter your nickname"]').value;
        const dateOfBirth = document.querySelector('input[placeholder="Enter your date of birth"]').value;
        const phone = document.querySelector('input[placeholder="Enter your phone number"]').value;
        const description = document.querySelector('input[placeholder="Write some information about yourself"]').value;

        const userId = localStorage.getItem('userId'); 

        try {
            const response = await fetch(`http://localhost:8000/auth/profile/${userId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    name,
                    nickname,
                    date_of_birth: dateOfBirth,
                    phone_number: phone,
                    description,
                }),
            });

            const result = await response.json();

            if (response.ok) {
                alert('Profile updated successfully!');
                const usernameElement = document.getElementById('username');
                usernameElement.textContent = nickname; 
            } else {
                alert(`Error: ${result.error}`);
            }
        } catch (err) {
            console.error('Error:', err);
            alert('An error occurred while updating the profile.');
        }
    }
});
document.body.addEventListener('click', async (event) => {
    if (event.target.tagName === 'BUTTON' && event.target.textContent === 'Update password') {
        const currentPassword = document.querySelector('input[placeholder="Enter current password"]').value;
        const newPassword = document.querySelector('input[placeholder="Enter new password"]').value;
        const confirmPassword = document.querySelector('input[placeholder="Confirm new password"]').value;

        const userId = localStorage.getItem('userId'); 
        const token = localStorage.getItem('token'); // Для авторизації

       // Валідація полів
        if (!currentPassword || !newPassword || !confirmPassword) {
        alert('Please fill out all fields.');
        return;
        }
        if (newPassword !== confirmPassword) {
            alert('New password and confirmation do not match.');
            return;
        }

        if (newPassword.length < 6) { // Приклад мінімальної довжини
            alert('New password must be at least 6 characters long.');
            return;
        }

        try {
            const response = await fetch('http://localhost:8000/auth/update-password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                },
                body: JSON.stringify({
                    userId,
                    currentPassword,
                    newPassword,
                }),
            });

            const result = await response.json();

            if (response.ok) {
                alert('Password updated successfully!');
            } else {
                alert(`Error: ${result.error}`);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while updating the password.');
        }
    }
});
document.addEventListener('click', (event) => {
    if (event.target.closest('.toggle-password')) {
        const toggle = event.target.closest('.toggle-password');
        const inputId = toggle.getAttribute('data-target');
        const input = document.getElementById(inputId);

        if (input) {
            // Перемикання типу поля
            if (input.type === 'password') {
                input.type = 'text';
                toggle.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                toggle.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }
    }
});
document.body.addEventListener('click', async (event) => {
    const userId = localStorage.getItem('userId'); 

    if (event.target.id === 'close-account-btn') {
        if (!confirm('Are you sure you want to close your account?')) {
            return;
        }

        try {
            const response = await fetch('http://localhost:8000/auth/close-account', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ userId }),
            });

            const result = await response.json();

            if (response.ok) {
                alert(result.message);
            } else {
                alert(`Error: ${result.error}`);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while closing the account.');
        }
    }

    if (event.target.id === 'open-account-btn') {
        if (!confirm('Are you sure you want to open your account?')) {
            return;
        }

        try {
            const response = await fetch('http://localhost:8000/auth/open-account', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ userId }),
            });

            const result = await response.json();

            if (response.ok) {
                alert(result.message);
            } else {
                alert(`Error: ${result.error}`);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while opening the account.');
        }
    }
});

// Приклад API-запиту для отримання профілю користувача
async function fetchUserProfile() {
    const userId = localStorage.getItem('userId');

    if (!userId) {
        console.error('User not logged in!');
        return;
    }

    try {
        const response = await fetch(`http://localhost:8000/auth/profile/${userId}`);
        const data = await response.json();

        if (response.ok) {
            // Оновлюємо значення в елементі <p id="username">
            const usernameElement = document.getElementById('username');
            usernameElement.textContent = data.nickname || 'Default Username';
        } else {
            console.error('Failed to fetch user profile:', data.error);
        }
    } catch (err) {
        console.error('Error fetching user profile:', err);
    }
}

// Виклик функції під час завантаження сторінки
window.addEventListener('DOMContentLoaded', fetchUserProfile);
