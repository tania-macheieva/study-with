<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study With</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <link rel="stylesheet" href="/profile-page/style.css">
</head>

<body>
    

    <div class="page-container">
        <div class="content">
            <main class="profile-container">
                <div class="user-info">
                    <label for="upload-image">
                        <img id="profile-image" class="profile-image" src="/images/profile-picture.png" alt="user image">
                    </label>
                    <input type="file" id="upload-image" accept="image/*" style="display: none;">
                    <div class="action-buttons">
                        <button id="confirm-image" style="display: none;" title="Confirm">
                            <i class="fas fa-check"></i>
                        </button>
                        <button id="remove-image" style="display: none;" title="Remove">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <p data-lang="username">username</p> 
                </div>

                <div class="container-my">
                    <div class="my-courses">
                        <h2 data-lang="myCourses">My courses</h2>
                        <div class="courses-list">
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 1</p>
                                <div class="progress-bar">
                                    <span style="width: 70%;"></span>
                                </div>
                                <p class="percent">70%</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 2</p>
                                <div class="progress-bar">
                                    <span style="width: 40%;"></span>
                                </div>
                                <p class="percent">40%</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                            <div class="course">
                                <p class="p-1" data-lang="courseName">Course name 3</p>
                                <div class="progress-bar">
                                    <span style="width: 50%;"></span>
                                </div>
                                <p class="percent">50%</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-resume" data-lang="btnResume">Resume</button>
                            </div>
                        </div>
                        <button class="btn-view-all-1" data-lang="btnViewAll">View all</button>
                    </div>
                    <div>
                        <div class="my-certificates">
                            <h2>My certificates</h2>
                            <div class="certificates-list">
                                <div class="certificate">
                                    <p class="p-1" data-lang="myCertificates">Certificate name 1</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download">
                                        <img src="/images/download-certificate.png" alt="">
                                    </button>
                                </div>
                                <div class="certificate">
                                    <p class="p-1" data-lang="myCertificates">Certificate name 2</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download">
                                        <img src="/images/download-certificate.png" alt="">
                                    </button>
                                </div>
                                <div class="certificate">
                                    <p class="p-1" data-lang="myCertificates">Certificate name 3</p>
                                    <p class="p-2" data-lang="completedOn">Completed on dd/mm/yyyy</p>
                                    <button class="btn-download">
                                        <img src="/images/download-certificate.png" alt="">
                                    </button>
                                </div>
                            </div>
                            <button class="btn-view-all-3" data-lang="btnViewAll">View all</button>
                        </div>
                    </div>
                    <div class="my-bookmarks">
                        <h2 data-lang="myBookmarks">My bookmarks</h2>
                        <div class="bookmarks-list">
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 1</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 2</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                            <div class="bookmark">
                                <p class="p-1" data-lang="bookmarkName">Bookmark name 3</p>
                                <img src="/images/250x100.png" alt="image">
                                <button class="btn-open" data-lang="btnOpen">Open</button>
                            </div>
                        </div>
                        <button class="btn-view-all-4" data-lang="btnViewAll">View all</button>
                    </div>
            </main>
        </div>
 

    </div>

</body>
<script>
    const uploadInput = document.getElementById('upload-image');
    const profileImage = document.getElementById('profile-image');
    const removeImageButton = document.getElementById('remove-image');
    const confirmImageButton = document.getElementById('confirm-image');


    uploadInput.addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file) {

            if (file.size > 1 * 1024 * 1024) {
                alert('The file size exceeds 1 MB. Please upload a smaller file.');
                uploadInput.value = '';
                return;
            }


            const reader = new FileReader();
            reader.onload = function (e) {
                profileImage.src = e.target.result;
                removeImageButton.style.display = 'inline-block';
                confirmImageButton.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }
    });


    profileImage.addEventListener('click', function () {
        removeImageButton.style.display = 'inline-block';
        confirmImageButton.style.display = 'inline-block';
    });


    removeImageButton.addEventListener('click', function () {
        profileImage.src = 'images/profile-picture.png';
        uploadInput.value = '';
        removeImageButton.style.display = 'none';
        confirmImageButton.style.display = 'none';
    });


    confirmImageButton.addEventListener('click', function () {
        removeImageButton.style.display = 'none';
        confirmImageButton.style.display = 'none';
    });



    document.querySelectorAll('.btn-view-all-1').forEach(function (button) {
        button.addEventListener('click', function () {
            const section = button.closest('.container-my');
            const list = section.querySelector('.courses-list');

            if (list) {
                if (list.classList.contains('expanded')) {
                    list.classList.remove('expanded');
                    button.textContent = 'View all';
                } else {
                    list.classList.add('expanded');
                    button.textContent = 'View less';
                }
            }
        });
    });


    document.querySelectorAll('.btn-view-all-2').forEach(function (button) {
        button.addEventListener('click', function () {
            const section = button.closest('.container-my');
            const list = section.querySelector('.groups-list');

            if (list) {
                if (list.classList.contains('expanded')) {
                    list.classList.remove('expanded');
                    button.textContent = 'View all';
                } else {
                    list.classList.add('expanded');
                    button.textContent = 'View less';
                }
            }
        });
    });

    document.querySelectorAll('.btn-view-all-3').forEach(function (button) {
        button.addEventListener('click', function () {
            const section = button.closest('.container-my');
            const list = section.querySelector('.certificates-list');

            if (list) {
                if (list.classList.contains('expanded')) {
                    list.classList.remove('expanded');
                    button.textContent = 'View all';
                } else {
                    list.classList.add('expanded');
                    button.textContent = 'View less';
                }
            }
        });
    });

    document.querySelectorAll('.btn-view-all-4').forEach(function (button) {
        button.addEventListener('click', function () {
            const section = button.closest('.container-my');
            const list = section.querySelector('.bookmarks-list');

            if (list) {
                if (list.classList.contains('expanded')) {
                    list.classList.remove('expanded');
                    button.textContent = 'View all';
                } else {
                    list.classList.add('expanded');
                    button.textContent = 'View less';
                }
            }
        });
    });

    document.querySelectorAll('.btn-download').forEach(function (button) {
        button.addEventListener('click', function () {
            const certificateName = this.closest('.certificate').querySelector('.p-1').textContent;
            const certificateUrl = `/certificates/${encodeURIComponent(certificateName)}.pdf`;
            const downloadLink = document.createElement('a');

            downloadLink.href = certificateUrl;
            downloadLink.download = `${certificateName}.pdf`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    });

</script>
<script src="../header/auth-header.js"></script>
<script src="/footer/footer.js"></script>
<script src="teacher-lang.js"></script>
</html>
