<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith| Profile</title>
    <link rel="stylesheet" href="../profile-page/public-profile.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet" />
    <link rel="icon" href="../images/menu-logo.ico">

    <style>
        .truncate {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            line-clamp: 3;
            box-orient: vertical;
        }

        .show-more {
            display: inline-block;
            text-align: right;
            padding: 6px 20px;
            font-size: 16px;
            font-family: "Inter", sans-serif;
            font-weight: 640;
            background: #283044;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 8px;
            margin-left: auto;
        }

        .container {
            display: flex;
            justify-content: flex-end;
        }

        .hidden-items {
            display: none;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <main class="profile">
            <div class="left-p">
                <aside>
                    <div class="info">
                        <img class="profile-image" id="profile-image" src="/images/profile-picture.png" alt="user image"
                            width="150px" height="150px">
                        <p class="user-n" id="user-nickname">UserName</p>
                        <p class="user-n" id="real-name">RealName</p>
                    </div>

                    <div class="hobbies">
                        <h2><img src="/images/hobbies.png" alt="hobbies-ico" width="27px " height="27px">Hobbies</h2>
                        <ul class="hobbies-d" id="hobbies-list">
                            <!-- Hobbies will be dynamically added here -->
                        </ul>
                    </div>

                    <div class="languages">
                        <h2><img src="/images/lang.png" alt="language-ico" width="27px " height="27px">Languages</h2>
                        <ul id="languages-list">
                            <!-- Languages will be dynamically added here -->
                        </ul>
                    </div>
                </aside>
            </div>

            <div class="right-p">
                <h2><img src="/images/about-me.png" alt="about-me-ico" width="27px " height="27px">About me</h2>
                <p class="about-me truncate" id="about-me">An experienced teacher with over 7 years of experience in
                    programming...</p>
                <div class="container">
                    <span class="show-more" id="show-more">Show more...</span>
                </div>

                <h2><img src="/images/education.png" alt="education-ico" width="27px " height="27px">Education</h2>
                <ul id="education-list">
                    <!-- Education will be dynamically added here -->
                </ul>

                <h2><img src="/images/experience.png" alt="experience-ico" width="27px " height="27px">Experience</h2>
                <ul id="experience-list">
                    <!-- Experience will be dynamically added here -->
                </ul>

                <h2><img src="/images/my-courses.png" alt="my-courses-ico" width="27px " height="27px">My courses</h2>
                <div class="courses-list" id="courses-list">
                    <!-- Courses will be dynamically added here -->
                </div>
                <div class="btn-container">
                    <button class="btn-view-all-1" data-lang="viewAll">View all</button>
                </div>

                <h2><img src="/images/Comment.png" alt="Comment" width="27px " height="27px">Student reviews</h2>
                <div class="reviews-list" id="reviews-list">
                    <!-- Reviews will be dynamically added here -->
                </div>
                <div class="btn-container">
                    <button class="btn-view-all-2" data-lang="viewAll">View all</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
                const aboutMe = document.getElementById("about-me");
                const showMore = document.getElementById("show-more");
 
                const checkAboutMeHeight = () => {
                    const fullHeight = aboutMe.scrollHeight;
                    const visibleHeight = aboutMe.offsetHeight;
                    if (fullHeight <= visibleHeight) { showMore.style.display = "none"; } else { showMore.style.display = "inline-block"; }
                };
                checkAboutMeHeight();
                showMore.addEventListener("click", () => {
                    aboutMe.classList.toggle("truncate");
                    showMore.textContent = aboutMe.classList.contains("truncate") ? getTranslation('showMore') :
                        getTranslation('showLess');
                });

                showMore.textContent = getTranslation('showMore');
            });

            function getTranslation(key) {
                const userLang = localStorage.getItem('language') || 'en';
                return translations[userLang] && translations[userLang][key] ? translations[userLang][key] : key;
            }

            function limitVisibleItems(containerSelector, maxVisible, buttonSelector) {
                const container = document.querySelector(containerSelector);
                const items = Array.from(container.children);
                const button = document.querySelector(buttonSelector);

                if (items.length <= maxVisible) { button.style.display = "none"; return; } items.forEach((item, index) => {
                    if (index >= maxVisible) {
                        item.style.display = "none";
                        item.classList.add("hidden-item");
                    }
                });

                button.addEventListener("click", () => {
                    const hiddenItems = items.filter(item => item.classList.contains("hidden-item"));
                    hiddenItems.forEach(item => {
                        item.style.display = item.style.display === "none" ? "block" : "none";
                    });

                    const isAnyHidden = hiddenItems.some(item => item.style.display === "none");
                    button.textContent = isAnyHidden ? getTranslation('viewAll') : getTranslation('viewLess');
                });
            }

            document.addEventListener("DOMContentLoaded", () => {
                limitVisibleItems(".courses-list", 3, ".btn-view-all-1");
                limitVisibleItems(".reviews-list", 3, ".btn-view-all-2");
            });
    </script>
  

    <script src="../header/auth-header.js"></script>
    <script src="../footer/footer.js"></script>
    <script src="../profile-page/public-lang.js"></script>
    <script src="../profile-page/public-p.js"></script>

</body>

</html>
