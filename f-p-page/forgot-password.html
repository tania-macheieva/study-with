<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="images/logo.png" alt="logo">
            <span>StudyWith</span>
        </div>
        <nav class="menu">
            <div class="menu-left">
                <a href="#">All courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            <div class="menu-right">
                <a href="#">UA</a>
                <a href="#" class="btn">Sign In</a>
            </div>
        </nav>
    </header>
    
    <main class="forgot-password-container">
        <section>
            <img src="images/forgot-password.jpg" alt="Illustration" class="illustration">
        </section>

        <section class="forgot-section">
            <img src="images/arrow.jpg" alt="Arrow" class="arrow">
            <div class="forgot-box">
                <h2>Forgot your password?</h2>
                <p>Don’t worry, we will send you a message to reset your password.</p>
                <input type="email" class="email-input" placeholder="Email">
                <button class="btn">Continue</button>
            </div>
        </section>
    </main>

</body>
</html>
