<!DOCTYPE html>
<html>
<head>
    <title>Log In</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login/login.css">
</head>
<body>
  <script src="/header/header-noauth.js"></script>

    <div class="main-container">
        <div class="illustration">
            <img src="/login/rb_2148572901.png" alt="Illustration">
        </div>

        <div class="login-container">
            <h2>Log In</h2>

            <div class="login-form">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <div id="error-message" style="color: red; margin-bottom: 10px;"></div>
                <button type="button" onclick="handleLogin()">Sign In</button>
                <a href="/forgot-password">Forgot password?</a>
            </div>

            <a href="/auth/google">
                <img src="web_light_rd_ctn@2x.png" alt="google-sign-in">
            </a>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.redirected) {
                    window.location.href = response.url;
                    return;
                }

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('error-message').textContent = data.error;
                }
            } catch (error) {
                document.getElementById('error-message').textContent = 'Помилка сервера';
            }
        }
    </script>
</body>
</html>
