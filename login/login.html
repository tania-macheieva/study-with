<!DOCTYPE html>
<html>
  <head>
    <title>Log In</title>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../login/login.css" />
    <link rel="icon" href="../images/menu-logo.ico"> 
  </head>
  <body>
    <script src="../header/auth-header.js"></script>

    <div class="main-container">
      <div class="illustration">
        <img src="/images/rb_2148572901.png" alt="Illustration" />
      </div>

      <div class="login-container">
        <h2 data-lang="LogIn">Log In</h2>

        <div class="login-form">
          <input
            type="email"
            id="email"
            placeholder="Email"
            required
            data-lang="emailPlaceholder"
          />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
            data-lang="passwordPlaceholder"
          />
          <div id="error-message" style="color: red; margin-bottom: 10px"></div>
          <button
            type="button"
            onclick="handleLogin()"
            data-lang="signInButton"
          >
            Sign In
          </button>
          <a href="/forgot-password" data-lang="forgotPasswordLink"
            >Forgot password?</a
          >
        </div>

        <a href="/auth/google">
          <img src="../images/web_light_rd_ctn@2x.png" alt="google-sign-in" />
        </a>
      </div>
    </div>

    <script src="../login/login.js"></script>
    <script src="../login/login-lang.js"></script>
  </body>
</html>
