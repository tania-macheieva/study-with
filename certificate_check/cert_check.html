<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="cert_check.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <div class="all">
    <aside class="img_Cert">
    <img src="/images/cert_img.jpg" alt="Check your certificate">
    </aside>
    
    <div class="Check_cert_div">
        <h1>Check your certificate here!</h1>
        <input type="text" placeholder="Example: CERT-2025-12345">
        <p class="P_valid">Your certificate is valid</p>
        <p class="P_not_valid">Your certificate is not valid</p>
        <button>Check certificate</button>
    </div>
</div>
</body>
<script src="/header/auth-header.js"></script>
<script src="/footer/footer.js"></script>
</html>
