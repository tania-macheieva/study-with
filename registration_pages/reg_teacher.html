<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <!-- Підключення шрифтів -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reg_teacher.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images\ebook_12743761.png" alt="StudyWith logo">
            <span>StudyWith</span>
        </div>
        <nav class="menu">
            <div class="menu-left">
                <a href="#">All courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            <div class="menu-right">
                <a href="#">UA</a>
                <a href="#" class="btn">Sign In</a>
            </div>
        </nav>
    </header>

    <div class="content">
        <div class="illustration">
            <img src="images\Teacher student-rafiki.png" alt="Coach Illustration">
        </div>
        <div class="form-container">
            <h1>Create an account <br>as a teacher</h1>
            <form id="teacher-register-form">
                <input type="text" name="name" placeholder="Name" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="hidden" name="role" value="teacher">
                <button type="submit">Sign Up</button>
                <h3>or</h3>
                <div class="google-auth">
                    <a href="/auth/google" class="google-btn">
                        <img src="images/google_logo.png" alt="Google logo">
                        Continue with Google
                    </a>
                </div>
            </form>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
