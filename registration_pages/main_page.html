<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="pageTitle">StudyWith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../images/menu-logo.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            min-height: 720px;
            overflow: hidden;
        }

        body {
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            width: 100%;
        }

        .main-content {
            flex: 1;
            padding: 0;
            display: flex;
            align-items: center;
            height: 540px;
        }

        .main-content .container {
            display: flex;
            gap: 80px;
            align-items: center;
            padding: 0 20px;
            height: 100%;
        }

        .hero-image {
            flex: 1;
            max-width: 800px;
        }

        .hero-image img {
            width: 130%;
            height: auto;
        }

        .content-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
            position: relative;
        }

        .welcome-text {
            font-family: "Inter", Regular;
            font-weight: 500;
            font-size: 36px;
            line-height: 46px;
            text-align: center;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            margin-top: 20px;
        }

        .btn {
            position: relative;
            width: 300px;
            height: 90px;
            background: #283044;
            border-radius: 12px;
            text-decoration: none;
            border: 1px solid #283044;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        .btn:hover {
            color: #FFFFFF;
            transform: translate(-0.25rem, -0.25rem);
            background: #DCECFC;
            box-shadow: 0.25rem 0.25rem #283044;
        }

        .btn-text {
            font-weight: 500;
            font-size: 18px;
            line-height: 19px;
            color: #FFFFFF;
            text-align: center;
        }

        .btn:hover .btn-text {
            color: #283044;
        }

        .highlight-word {
            display: block;
            font-size: 24px;
            font-weight: 530;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <div class="hero-image">
                <img src="/images/10088.jpg" alt="Hero Image">
            </div>
            <div class="content-right">
                <div class="welcome-text" data-lang="welcomeText">
                    Welcome to StudyWith!<br>
                    Learn, connect, succeed together!
                </div>
                <div class="buttons">
                    <a href="/reg-student" class="btn">
                        <div class="btn-text">
                            Create an account as a
                            <span class="highlight-word">Student</span>
                        </div>
                    </a>
                    <a href="/reg-teacher" class="btn">
                        <div class="btn-text">
                            Create an account as a
                            <span class="highlight-word">Teacher</span>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="../footer/footer.js"></script>
    <script src="../header/auth-header.js"></script>
    <script src="../registration_pages/main-lang.js"></script>
</body>
</html>
