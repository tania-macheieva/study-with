<script src="./registration_pages/register.js"></script>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="pageTitle">StudyWith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../images/menu-logo.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            min-height: 720px;
            overflow: hidden;
        }

        body {
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 0;
            display: flex;
            align-items: center;
            height: 540px;
        }

        .main-content .container {
            display: flex;
            gap: 80px;
            align-items: center;
            padding: 0 20px;
            height: 100%;
        }

        .hero-image {
            flex: 1;
            max-width: 800px;
        }

        .hero-image img {
            width: 130%;
            height: auto;
        }

        .content-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
        }

        .welcome-text {
            font-family: "Inter", Regular;
            font-weight: 500;
            font-size: 36px;
            line-height: 46px;
            text-align: center;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
            margin-top: 20px; 
        }

.btn1 {
    width: 400px;
    height: 80px;
    font-family: "Inter", Regular;
  --bg: #283044;
  --hover-bg: #DCECFC;
  --hover-text: #000;
  color: #fff;
  cursor: pointer;
  border: 1px solid var(--bg);
  border-radius: 4px;
  padding: 0.8em 2em;
  background: var(--bg);
  transition: 0.2s;
text-align: center;
text-decoration: none;
display: flex;
    justify-content: center;
    align-items: center;
}

.btn1:hover {
  color: var(--hover-text);
  transform: translate(-0.25rem, -0.25rem);
  background: var(--hover-bg);
  box-shadow: 0.25rem 0.25rem var(--bg);
}

.btn1:active {
  transform: translate(0);
  box-shadow: none;
}

.btn2 {
     width: 400px;
    height: 80px;
    font-family: "Inter", Regular;
  --bg: #283044;
  --hover-bg: #fff;
  --hover-text: #000;
  color: #fff;
  cursor: pointer;
  border: 1px solid var(--bg);
  border-radius: 4px;
  padding: 0.8em 2em;
  background: var(--bg);
  transition: 0.2s;
text-align: center;
  text-decoration: none;
  display: flex;
    justify-content: center;
    align-items: center;
}

.btn2:hover {
  color: var(--hover-text);
  transform: translate(-0.25rem, -0.25rem);
  background: var(--hover-bg);
  box-shadow: 0.25rem 0.25rem var(--bg);
}

.btn2:active {
  transform: translate(0);
  box-shadow: none;
}
    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <div class="hero-image">
                <img src="/images/10088.jpg" alt="Hero Image">
            </div>
            <div class="content-right">
                <div class="welcome-text" data-lang="welcomeText">
                    Welcome to StudyWith!<br>
                    Learn, connect, succeed together!
                </div>
                <div class="buttons">
                    <a href="/reg-student" class="btn1" data-lang="studentAccount">Create an account as a student</a>
                    <a href="/reg-teacher" class="btn2" data-lang="teacherAccount">Create an account as a teacher</a>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="../footer/footer.js"></script>
    <script src="../header/auth-header.js"></script>
    <script src="../registration_pages/main-lang.js"></script>
</body>
</html>
