<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Montserrat:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            min-height: 720px;
            overflow: hidden;
        }

        body {
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            width: 100%;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 0;
            display: flex;
            align-items: center;
            height: 540px;
        }

        .main-content .container {
            display: flex;
            gap: 80px;
            align-items: center;
            padding: 0 20px;
            height: 100%;
        }

        .hero-image {
            flex: 1;
            max-width: 800px;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            transform: translateX(10%);
        }

        .content-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 48px;
            align-items: center;
        }

        .welcome-text {
            font-family: 'Jost', sans-serif;
            font-weight: 600;
            font-size: 40px;
            line-height: 46px;
            color: #000000;
            text-align: center;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 269px;
            align-items: center;
            margin-top: 20px; 
    
        }

        .btn {
        width: 400px;
        height: 120px;
        display: inline-block;
        padding:  20px;
        background-color: #283044; 
        color: #EBF5EE; 
        text-decoration: none; 
        font-family:'Jost', sans-serif;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.2;
        border-radius: 12px;
        border: none; 
        transition: background-color 0.3s ease;
        text-align: center;
        flex-direction: column;
        justify-content: center;
}

/* Ховер-ефект для кнопок */
.btn:hover {
    background-color: #0c101a; /* Темніший синій фон при наведенні */
}
      
        .btn span {
            display: block;
        }

        .btn .top-text {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .btn .bottom-text {
            font-size: 20px;
        }

    </style>
</head>
<body>
    <main class="main-content">
        <div class="container">
            <div class="hero-image">
                <img src="/images/10088.jpg" alt="Hero Image">
            </div>
            <div class="content-right">
                <div class="welcome-text">
                    Welcome to StudyWith!<br>
                    Learn, connect, succeed together!
                </div>
                <div class="buttons">
                    <a href="/reg-student" class="btn">Create an account as a student</a>
                    <a href="/reg-teacher" class="btn">Create an account as a teacher</a>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script src="/footer/footer.js"></script>
    <script src="/header/header-noauth.js"></script>
</body>
</html>
