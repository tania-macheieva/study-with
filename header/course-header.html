<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
    <link rel="stylesheet" href="/header/course-header.css">

</head>
<body>
    <header> 
        <div class="container">
            <div class="left-s">
                <h2 class="home" data-lang="home"> <img src="../images/arrow.svg" alt="arrow-exit-ico">Home</h2>
                <h2 class="course-n" data-lang="courseName"><img src="../images/save-c.svg" alt="save-course-ico">Course name course name</h2>
            </div>

            <div class="right-s">
                <div class="progress-container">
                    <div class="progress-bar">
                        <span style="width: 50%;"></span>
                    </div>
                    <div class="progress-text">
                        <span data-lang="progress">Progress</span>
                        <span class="percent">50%</span>
                    </div>
                </div>

                <div class="lang-switcher">
                    <a class="lang-btn" data-lang="en">EN</a> |
                    <a class="lang-btn" data-lang="ua">UA</a>
                </div>
                <button class="btn">
                    <a id="user" href="/profile-student">
                        <img src="../images/user-avatar.png" alt="user image" />
                    </a>
                </button>
                <div>
                    <button>
                        <img class="oth" src="../images/more.png" alt="other-options-ico">
                    </button>
                    <div class="dropdown-menu">
                        <a href="#" data-lang="shareCourse">
                            <img src="../images/share-c.svg" alt="share-ico">
                            Share this course</a>
                        <a href="#" data-lang="unenrollCourse">
                            <img src="../images/unenroll.svg" alt="Unenroll">
                            Unenroll from this course</a>
                        
                    </div>
                </div>
            </div>
        </div>
    </header>
    <script> src="/header/course-header.js" </script>
    <script>
        
        document.querySelector('.oth').parentElement.addEventListener('click', function (e) {
                e.stopPropagation();
                const dropdownMenu = this.nextElementSibling;
                dropdownMenu.classList.toggle('show');
            });

            document.addEventListener('click', function (e) {
                const dropdownMenus = document.querySelectorAll('.dropdown-menu');
                dropdownMenus.forEach(menu => {
                    if (!menu.contains(e.target)) {
                        menu.classList.remove('show');
                    }
                });
            });
 // Переклади
const headerTranslations = {
    en: {
        home: "Home",
        courseName: "Course name",
        progress:"Progress",
        shareCourse: "Share this course",
        unenrollCourse: "Unenroll from this course",
    },
    ua: {
        home: "Головна сторінка",
        courseName: "Назва курсу",
        progress:"Прогрес",
        shareCourse: "Поділитися цим курсом",
        unenrollCourse: "Відписатися від цього курсу",
    },
};

// Функція ініціалізації мови
function initializeLanguage() {
            const currentLang = localStorage.getItem("language") || "en";
            document.documentElement.lang = currentLang;

            const langSwitcher = document.querySelector(".lang-switcher");
            if (langSwitcher) {
                const buttons = langSwitcher.querySelectorAll(".lang-btn");
                buttons.forEach((btn) => {
                    btn.classList.toggle("active", btn.getAttribute("data-lang") === currentLang);
                });

                langSwitcher.addEventListener("click", (event) => {
                    if (event.target.classList.contains("lang-btn")) {
                        event.preventDefault();
                        const selectedLang = event.target.getAttribute("data-lang");

                        if (selectedLang !== currentLang) {
                            localStorage.setItem("language", selectedLang);
                            applyTranslations(selectedLang);

                            buttons.forEach((btn) => {
                                btn.classList.toggle("active", btn.getAttribute("data-lang") === selectedLang);
                            });
                        }
                    }
                });
            }

            applyTranslations(currentLang);
        }

        // Функція застосування перекладів
        function applyTranslations(lang) {
            const translations = headerTranslations[lang];
            if (!translations) return;

            document.querySelectorAll("[data-lang]").forEach((element) => {
                const key = element.getAttribute("data-lang");
                if (translations[key]) {
                    if (element.querySelector("img")) {
                        let textNode = Array.from(element.childNodes).find(
                            (node) => node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== ""
                        );

                        if (textNode) {
                            textNode.textContent = ` ${translations[key]}`;
                        } else {
                            element.appendChild(document.createTextNode(` ${translations[key]}`));
                        }
                    } else {
                        element.textContent = translations[key];
                    }
                }
            });
        }

        document.addEventListener("DOMContentLoaded", initializeLanguage);

    </script>
</body>
</html>
