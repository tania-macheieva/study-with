<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study With</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet" />
  <link

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<body>
  <header class="site-header">
    <div class="container">
      <div class="left-section">

          <a href="/">
            <img src="/images/ebook_12743761.png" alt="StudyWith Logo">

          </a>
        </div>
        <nav class="nav-menu">
          <a href="/courses" data-lang="all-courses">All courses</a>

      </div>
      <div class="right-section">

          <input type="text" placeholder="Search..." />
          <img class="search-btn" src="/images/icons8-search-50.png" alt="search-btn" />
        </div>
        <div class="lang-switcher">
          <a href="#" class="lang-btn" data-lang="en">EN</a> |
          <a href="#" class="lang-btn" data-lang="ua">UA</a>

        <button class="btn">
