<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyWith</title>
  <link rel="preload" href="path/to/font.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <script src="https://js.stripe.com/v3/"></script>
  <link rel="stylesheet" href="../pay-page/style.css" />
  <link rel="icon" href="../images/menu-logo.ico">
</head>

<body>
  <main>
    <div class="course-card">
      <h2>Course Details</h2>
      <div id="course-info"></div>
    </div>
  </main>

  <script>
    let stripe;
    const courseId = new URLSearchParams(window.location.search).get("id");

    if (!courseId) {
      alert("Course ID not found!");
      window.location.href = "/";
    }

    // Ініціалізація Stripe
    async function initializeStripe() {
      try {
        const response = await fetch("/get-stripe-key");
        const data = await response.json();
        stripe = Stripe(data.publicKey);
      } catch (error) {
        console.error('Error initializing Stripe:', error);
      }
    }

    // Функція для обробки кліку по кнопці оплати
    async function handleCheckout() {
      try {
        const response = await fetch("/pay-page/create-checkout-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            courseId: courseId,
            userId: localStorage.getItem('userId')
          }),
        });

        const data = await response.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error('No checkout URL received');
        }
      } catch (error) {
        console.error('Checkout error:', error);
        alert('Payment initialization failed: ' + error.message);
      }
    }

    function updateUI(course) {
      const courseInfo = document.getElementById("course-info");
      const price = parseFloat(course.price);
      const userId = localStorage.getItem('userId');

      courseInfo.innerHTML = `
          <h3>${course.name}</h3>
          <p>${course.description}</p>
          <div class="price-section">
            <div class="total-price">Total: $${price.toFixed(2)}</div>
            <button id="checkout-button" class="checkout-button">
              Proceed to Payment
            </button>
          </div>
        `;

      const checkoutButton = document.getElementById('checkout-button');

      if (course.author_id === parseInt(userId)) {
        checkoutButton.disabled = true;
        checkoutButton.textContent = 'You cannot purchase your own course';
        checkoutButton.classList.add('disabled');
      } else {
        checkoutButton.addEventListener('click', handleCheckout);
      }
    }

    // Ініціалізація сторінки
    document.addEventListener('DOMContentLoaded', async function () {
      // Ініціалізуємо Stripe
      await initializeStripe();

      // Завантажуємо інформацію про курс
      try {
        const response = await fetch(`/pay-page/course/${courseId}`);
        const course = await response.json();
        console.log('Course data:', course);
        updateUI(course);
      } catch (error) {
        console.error('Error loading course:', error);
        alert('Error loading course details');
      }
    });
  </script>
</body>

</html>
