<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyWith</title>
    <link
      rel="preload"
      href="path/to/font.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://js.stripe.com/v3/"></script>
    <link rel="stylesheet" href="/pay-page/style.css" />
    <script src="stripe.js"></script>
  </head>

  <body>
    <main>
      <div class="course-card">
        <h2>Course Details</h2>
        <div id="course-info"></div>
      </div>
    </main>

    <!-- Модальне вікно для вибору донату -->
    <div id="donation-modal" class="modal">
      <div class="modal-content">
        <h3>Select Donation Amount</h3>
        <button class="modal-button" onclick="selectDonation(0)">
          $0 (No donation)
        </button>
        <button class="modal-button" onclick="selectDonation(5)">$5</button>
        <button class="modal-button" onclick="selectDonation(10)">$10</button>
        <button class="modal-button" onclick="selectDonation(20)">$20</button>
        <button class="modal-button" onclick="closeModal()">Cancel</button>
      </div>
    </div>

    <script>
      const courseId = new URLSearchParams(window.location.search).get("id");
      if (!courseId) {
        alert("Course ID not found!");
        window.location.href = "/";
      }

      let selectedDonation = 0;
      const donationOptions = [0, 5, 10, 20];

      function updateUI(course) {
        const courseInfo = document.getElementById("course-info");
        const basePrice = parseFloat(course.price);
        const totalPrice = basePrice + selectedDonation;

        courseInfo.innerHTML = `
                <h3>${course.name}</h3>
                <p>${course.description}</p>
                
                <div class="donation-section">
                    <h3>Support our platform</h3>
                    <p>Choose an amount to donate:</p>
                    <div class="donation-buttons">
                        ${donationOptions
                          .map(
                            (amount) =>
                              `<button 
                                class="donation-button ${
                                  amount === selectedDonation ? "selected" : ""
                                }"
                                onclick="openModal()"
                            >
                                ${
                                  amount === 0 ? "No donation" : `$${amount}`
                                }</button>`
                          )
                          .join("")}
                    </div>
                </div>

                <div class="price-section">
                    <div class="total-price">Total: $${totalPrice.toFixed(
                      2
                    )}</div>
                    <div class="price-breakdown">
                        Course price: $${basePrice.toFixed(2)}<br>
                        ${
                          selectedDonation > 0
                            ? `Donation: $${selectedDonation.toFixed(2)}`
                            : ""
                        }
                    </div>
                    <button id="checkout-button" class="checkout-button">
                        Proceed to Payment
                    </button>
                </div>
            `;

        setupCheckoutButton(course);
      }

      function openModal() {
        document.getElementById("donation-modal").style.display = "block";
      }

      function closeModal() {
        document.getElementById("donation-modal").style.display = "none";
      }

      function selectDonation(amount) {
        selectedDonation = amount;
        closeModal();
        fetch(`/pay-page/course/${courseId}`)
          .then((res) => res.json())
          .then((course) => {
            updateUI(course);
          });
      }

      function setupCheckoutButton(course) {
        fetch("/get-stripe-key")
          .then((response) => response.json())
          .then((data) => {
            const stripe = Stripe(data.publicKey);

            document
              .getElementById("checkout-button")
              .addEventListener("click", () => {
                fetch("/pay-page/create-checkout-session", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    courseId,
                    donationAmount: selectedDonation,
                  }),
                })
                  .then((response) => response.json())
                  .then((session) => {
                    window.location.href = session.url;
                  })
                  .catch((error) => console.error("Error:", error));
              });
          })
          .catch((error) => console.error("Error fetching public key:", error));
      }

      fetch(`/pay-page/course/${courseId}`)
        .then((res) => res.json())
        .then((course) => updateUI(course))
        .catch((error) => {
          console.error("Error:", error);
          alert("Error loading the course");
        });
    </script>
  </body>
</html>
