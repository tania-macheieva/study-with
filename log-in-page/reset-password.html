<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/log-in-page/forgot-password.css">
</head>
<body>

    <script src="/header/header-login.js"></script>
    
    <main class="forgot-password-container">
        <section>
            <img src="images/forgot-password.jpg" alt="Illustration" class="illustration">
        </section>

        <section class="forgot-section">
            <img src="images/arrow.jpg" alt="Arrow" class="arrow">
            <div class="forgot-box">
                <h2>Reset password</h2>
                <p>Create a new password for your account.</p>
                <input type="password" class="password-input" placeholder="New password">
                <input type="password" class="confirm-password-input" placeholder="Confirm password">

                <button class="btn reset-password-btn">Reset password</button>
            </div>
        </section>
    </main>
    <script src="/footer/footer.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM fully loaded and parsed');

    const passwordInput = document.querySelector('.password-input');
    const confirmPasswordInput = document.querySelector('.confirm-password-input');
    const resetPasswordButton = document.querySelector('.reset-password-btn');

    // Функція для отримання параметрів з URL
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Отримуємо токен з URL
    const token = getQueryParam('token');

    // Перевірка, чи всі елементи знайдені
    if (!passwordInput || !confirmPasswordInput || !resetPasswordButton) {
        console.error('One or more elements not found');
        return; // Вихід, якщо один з елементів не знайдено
    }

    resetPasswordButton.addEventListener('click', async (event) => {
        event.preventDefault(); // Запобігаємо перезавантаженню сторінки

        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();

        // Перевірка на заповненість полів
        if (!password || !confirmPassword) {
            alert('Please fill in both password fields.');
            return;
        }

        // Перевірка на співпадіння паролів
        if (password !== confirmPassword) {
            alert('Passwords do not match.');
            return;
        }

        try {
            console.log('Sending request to server...');
            const response = await fetch('http://localhost:8000/auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ token, password }), // Використовуємо токен з URL
            });

            const data = await response.json();
            console.log('Response received:', data);

            if (response.ok) {
                alert(data.message);
                window.location.href = 'login.html'; // Перенаправлення на сторінку входу
            } else {
                alert(data.error);
                console.error('Error response:', data.error);
            }
        } catch (error) {
            console.error('Fetch error:', error);
            alert('An error occurred. Please try again later.');
        }
    });
});
</script>
</body>
</html>
