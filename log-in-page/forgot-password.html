<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyWith</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="f-p-page/images/logo.png" alt="logo">
            <span>StudyWith</span>
        </div>
        <nav class="menu">
            <div class="menu-left">
                <a href="#">All courses</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </div>
            <div class="menu-right">
                <a href="#">UA</a>
                <a href="#" class="btn">Sign In</a>
            </div>
        </nav>
    </header>
    
    <main class="forgot-password-container">
        <section>
            <img src="f-p-page/images/forgot-password.jpg" alt="Illustration" class="illustration">
        </section>

        <section class="forgot-section">
            <img src="f-p-page/images/arrow.jpg" alt="Arrow" class="arrow">
            <div class="forgot-box">
                <h2>Forgot your password?</h2>
                <p>Don’t worry, we will send you a message to reset your password.</p>
                <input type="email" class="email-input" placeholder="Email">
                <button class="btn continue-btn">Continue</button>
            </div>
        </section>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM fully loaded and parsed'); // Лог, коли DOM завантажено
    const emailInput = document.querySelector('.email-input');
    const submitButton = document.querySelector('.continue-btn');

    if (!emailInput || !submitButton) {
        console.error('Email input or submit button not found');
        return;
    }

    submitButton.addEventListener('click', async (event) => {
        console.log('Submit button clicked'); // Лог при натисканні кнопки
        event.preventDefault(); // Запобігаємо перезавантаженню сторінки

        const email = emailInput.value.trim();
        console.log('Email input:', email); // Лог введеного email

        if (!email) {
            alert('Please enter your email address.');
            console.warn('No email entered'); // Лог попередження
            return;
        }

        try {
            console.log('Sending request to server...'); // Лог перед відправкою запиту
            const response = await fetch('http://localhost:8000/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email }),
            });

            console.log('Response received:', response); // Лог отриманої відповіді
            const data = await response.json();
            console.log('Response data:', data); // Лог даних відповіді

            if (response.ok) {
                alert(data.message);
                console.log('Redirecting to reset-password.html'); // Лог перенаправлення
                window.location.href = 'reset-password.html';
            } else {
                alert(data.error);
                console.error('Error response:', data.error); // Лог помилки
            }
        } catch (error) {
            console.error('Fetch error:', error); // Лог помилки fetch
            alert('An error occurred. Please try again later.');
        }
    });
});
    </script>
</body>
</html>
